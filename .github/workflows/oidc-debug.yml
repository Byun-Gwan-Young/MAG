# Temporary (DM-123) : shows which subject and audience GitHub puts in the OIDC token for the production environment,
# so the AWS role's trust policy can be compared with it. Prints only the claims, never the token. Remove after use.
name: OIDC claims (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  claims:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      id-token: write
    steps:
      - name: Print the token's claims (not the token)
        run: |
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          while (( ${#payload} % 4 )); do payload+='='; done
          printf '%s' "$payload" | base64 -d | jq '{sub, aud, iss, repository, repository_owner, environment, ref}'
