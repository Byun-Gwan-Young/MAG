# C-19-11 part 1 (DM-119, DM-122) : the offline checks, with no secret and no outside call.
# Runs on every pull request, and — called by deploy.yml — on every push to main and every manual deploy, so nothing is
# deployed unless this passed on the same commit.
#   python   : the whole offline suite (tools/run_offline_tests.py ; it reports any network attempt a test made, and
#              tools/ci_check.py fails the job on one), then the freeze check (tools/final_freeze.py check).
#   frontend : npm ci, the build, the unit tests (node --test). The browser tests (Playwright) stay on the PM's computer.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Offline tests and freeze check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the freeze record and the bundle tests read git history
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Packages (pinned)
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Offline tests (no key, no network)
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python tools/run_offline_tests.py --baseline tests/fixtures/p0-3-mechanism-test-ids.json \
            --output "$RUNNER_TEMP/tests.json" > "$RUNNER_TEMP/tests.out" 2>&1 || true
          python tools/ci_check.py "$RUNNER_TEMP/tests.json"
      - name: Freeze check
        run: python tools/final_freeze.py check
      - name: Test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-tests
          path: ${{ runner.temp }}/tests.json
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
