# DM-117 본 계획 : 비코딩 데이터 확보 — 고객 지원 · 시장 조사 · 논문 조사의 v2 정상판 5 + 교착판 5, 관측 모드 30 세션.
# 시험 계획 nc-trial-v2 에서 교착판이 교착에 닿는 것을 확인한 뒤 돌린다.
# CS 교착판은 뺐다 : 시험 3 회(nc-trial-v2, -cs, -cs2) 모두 4 step 성공 — 정책을 정면 충돌로 바꿔도 모델이 상충을 기록만 하고 환불 담당으로 해결했다.
# MR·LR 교착판은 시험에서 30 step 정체(첫 STOP step 9 · 6). CS 는 도구로 순서를 강제한 v3 (DM-118) 로 따로 돌린다
#   (batch_plans/nc-trial-v3-cs.yaml → nc-main-v3-cs.yaml). 그래서 이 계획은 20 세션 = MR 10 + LR 10.
# 실행 (창 하나) : tools/run_batch.py run --plan batch_plans/nc-main-v2.yaml --lane 1 --lanes 1 --account-label A
# 창 둘로 나누면 LR (one_at_a_time) 은 마지막 레인으로 간다 : --lane 1 --lanes 2 / --lane 2 --lanes 2
plan_version: demo-batch-plan-v1
plan_id: nc-main-v2
requires_final_freeze: true
description: 비코딩 데이터 확보 v2 MR·LR 정상 10 + 교착 10 (DM-117, CS 는 v3 계획으로)
items:
- {scenario: scenarios/DEMO-MR-normal-v2.yaml, mode: observe, repeats: [1, 2, 3, 4, 5]}
- {scenario: scenarios/DEMO-MR-stall-v2.yaml, mode: observe, repeats: [1, 2, 3, 4, 5]}
- {scenario: scenarios/DEMO-LR-normal-v2.yaml, mode: observe, repeats: [1, 2, 3, 4, 5], one_at_a_time: true}
- {scenario: scenarios/DEMO-LR-stall-v2.yaml, mode: observe, repeats: [1, 2, 3, 4, 5], one_at_a_time: true}
